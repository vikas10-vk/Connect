[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradie-backend"
version = "1.0.0"
requires-python = ">=3.12"

# =============================================================================
# VERSIONS PINNED TO MATCH YOUR EXISTING VENV
# Confirmed from your installed packages — do not change these without testing.
# =============================================================================

dependencies = [
    # Web framework
    "fastapi==0.135.1",
    "uvicorn[standard]==0.42.0",
    "gunicorn==25.1.0",

    # Database
    "sqlalchemy[asyncio]==2.0.48",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.11",

    # Settings & validation
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "python-dotenv==1.2.2",
    "email-validator==2.3.0",

    # Security
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "cryptography==46.0.5",

    # Redis & Celery
    "redis[hiredis]==5.0.4",
    "celery[redis]==5.6.2",
    "flower==2.0.1",

    # HTTP client
    "httpx==0.28.1",

    # Monitoring
    "sentry-sdk[fastapi]==2.56.0",

    # Utilities
    "python-multipart==0.0.22",
    "orjson",
    "python-dateutil==2.9.0",

    # AI (your existing ai_agent_service + ai_chat)
    "groq==1.1.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "factory-boy==3.3.1",
    "faker==33.1.0",

    # Linting
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # line too long
    "B008",   # function calls in default args (FastAPI Depends)
]

[tool.hatch.build.targets.wheel]
only-include = [
    "/*.py",
    "/alembic",
    "/db",
    "/middleware",
    "/models",
    "/routers",
    "/schemas",
    "/scratch",
    "/scripts",
    "/seeds",
    "/services",
    "/tasks",
    "/workers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*", "venv/*", "scratch/*", "seeds/*"]
