# =============================================================================
# postgres/postgresql.conf — PostgreSQL production tuning
# Target hardware: 4 vCPU, 8GB RAM (DigitalOcean/Hetzner launch server)
# Tradie Platform — Production
# =============================================================================
#
# HOW TO APPLY:
# This file is mounted into the PostgreSQL container via docker-compose.prod.yml:
#   volumes:
#     - ./nginx/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
# And referenced via the PostgreSQL command:
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# WHY THESE SETTINGS:
# PostgreSQL's defaults are extremely conservative — designed to run on a 256MB
# server from 1996. On a modern server they leave 90% of available performance
# on the table. These settings are tuned for your specific hardware.
# =============================================================================

# =============================================================================
# CONNECTIONS
# =============================================================================

# Maximum number of client connections.
# Each connection uses ~5MB of memory at rest.
# 100 connections × 5MB = 500MB reserved just for connections.
# At launch, with PgBouncer you will never approach this — the pool handles it.
# Without PgBouncer, your FastAPI connection pool should target max 80 here.
max_connections = 100

# Reserve connections for superuser/admin (psql maintenance, backups).
superuser_reserved_connections = 3

# =============================================================================
# MEMORY
# =============================================================================

# shared_buffers: PostgreSQL's in-memory cache for data pages.
# Rule of thumb: 25% of total RAM.
# 8GB × 25% = 2GB
shared_buffers = 2GB

# effective_cache_size: hint to the query planner about total memory available
# for caching (shared_buffers + OS page cache). Does NOT allocate memory.
# Rule of thumb: 50–75% of total RAM.
effective_cache_size = 6GB

# work_mem: memory per sort operation or hash join.
# Used per-operation, not per-connection — a complex query can use this
# multiple times simultaneously.
# Formula: (RAM - shared_buffers) / (max_connections × 2)
# (8GB - 2GB) / (100 × 2) = ~30MB. Round down for safety.
# WARNING: Setting this too high causes OOM if many connections run heavy queries.
work_mem = 16MB

# maintenance_work_mem: memory for VACUUM, CREATE INDEX, ALTER TABLE.
# Higher = faster index builds and autovacuum runs.
# Set to 10% of RAM.
maintenance_work_mem = 512MB

# =============================================================================
# WAL (Write-Ahead Log) — controls durability and write performance
# =============================================================================

# wal_buffers: memory for WAL data before writing to disk.
# -1 means auto-set based on shared_buffers (usually 1/32 of shared_buffers).
# 64MB is a good explicit value for a write-heavy workload.
wal_buffers = 64MB

# checkpoint_completion_target: spread checkpoint writes over this fraction
# of the checkpoint interval to reduce I/O spikes.
# 0.9 = spread over 90% of the interval (smoother I/O).
checkpoint_completion_target = 0.9

# min_wal_size / max_wal_size: control how much WAL disk space is used.
# Higher max allows PostgreSQL to recycle WAL files instead of deleting/creating.
min_wal_size = 1GB
max_wal_size = 4GB

# =============================================================================
# QUERY PLANNER
# =============================================================================

# random_page_cost: cost of a non-sequential disk read.
# Default is 4.0 (assumes spinning disk).
# SSD storage: set to 1.1–2.0 (random reads are much cheaper on SSD).
# This makes the planner more likely to use index scans.
random_page_cost = 1.1

# effective_io_concurrency: number of concurrent I/O operations for bitmap heap
# scans. For SSD: set to 200. For HDD: set to 2.
effective_io_concurrency = 200

# =============================================================================
# AUTOVACUUM — keeps tables healthy automatically
# =============================================================================

# Autovacuum must be on. Never turn it off.
autovacuum = on

# How many autovacuum workers can run simultaneously.
# 3 is appropriate for a server with several active tables.
autovacuum_max_workers = 3

# Vacuum runs when (threshold + scale_factor × table_rows) dead tuples exist.
# Scale factor of 0.05 = vacuum when 5% of rows are dead.
# Lower than default (0.2) — important for high-traffic tables like job_events
# that get many updates/deletes.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# =============================================================================
# LOGGING — structured logging for your log aggregation stack
# =============================================================================

# Log destination: stderr is captured by Docker and can be shipped to Papertrail/Logtail.
log_destination = 'stderr'

# Log all queries taking longer than this threshold.
# 1000ms = 1 second. Any query slower than this is a candidate for optimization.
# Set to 500ms after initial tuning.
log_min_duration_statement = 1000   # milliseconds

# Log connection attempts — useful for detecting connection pool issues.
log_connections = on
log_disconnections = on

# =============================================================================
# SAFETY LIMITS
# =============================================================================

# Kill any query that runs longer than 30 seconds.
# This is your defence against runaway queries caused by missing indexes,
# accidental full-table scans, or SQL injection attempts.
# Specific long-running maintenance tasks (backups, report generation) can
# override this with SET statement_timeout = 0 at the session level.
statement_timeout = 30000   # milliseconds

# Kill idle transactions that have been open for more than 10 minutes.
# An open transaction holds locks. A forgotten open transaction can block
# your entire booking flow.
idle_in_transaction_session_timeout = 600000   # milliseconds (10 minutes)

# =============================================================================
# REPLICATION (prepare for Stage 2 read replica)
# =============================================================================

# wal_level = replica: enables WAL data needed for streaming replication.
# Set this now even if you do not have a replica yet. Changing it later
# requires a server restart.
wal_level = replica

# Maximum number of replication connections.
# 0 means replication is not yet enabled. Set to 1 when you add a read replica.
max_wal_senders = 1

# =============================================================================
# TIMEZONE
# =============================================================================

# Store all timestamps in UTC. Convert to local time in the application layer.
# Never store local time in the database.
timezone = 'UTC'