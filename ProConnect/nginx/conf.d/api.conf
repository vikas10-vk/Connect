# =============================================================================
# conf.d/api.conf — API subdomain server block
# Handles: api.yourdomain.com
# Tradie Platform — Production
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;

    # -------------------------------------------------------------------------
    # CORS — handled here in production. FastAPI CORSMiddleware is disabled
    # in production (ENVIRONMENT=production) to prevent duplicate headers.
    # Duplicate Access-Control-Allow-Origin headers cause browsers to reject
    # the response entirely — API calls fail silently on the frontend.
    # -------------------------------------------------------------------------
    set $cors_origin "";
    if ($http_origin ~* "^https://(app|ws)\.yourdomain\.com$") {
        set $cors_origin $http_origin;
    }

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Request-ID, X-Idempotency-Key" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age           86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers    "X-Request-ID" always;

    # -------------------------------------------------------------------------
    # Connection limits
    # -------------------------------------------------------------------------
    limit_conn conn_limit_per_ip 20;

    # -------------------------------------------------------------------------
    # Stripe webhook — NO rate limiting.
    #
    # FIX: Stripe sends webhooks in bursts during retries (payment failure,
    # network timeout, etc.). If Stripe hits the rate limit:
    #   - The webhook returns 429
    #   - Stripe retries with backoff
    #   - If retries exhaust, the event is lost
    #   - Lost payment.captured event = funds never released to tradie
    #
    # Stripe webhook requests are signed (STRIPE_WEBHOOK_SECRET).
    # FastAPI verifies the signature before processing.
    # No rate limit is needed — unauthenticated requests cannot fake a valid signature.
    # -------------------------------------------------------------------------
    location /v1/payments/webhook {
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
        # Stripe sends webhooks as POST with JSON body.
        # Increase body size limit if needed for large event payloads.
        client_max_body_size 1m;
    }

    # Also exempt the alternative webhook path if both exist.
    location /v1/payments/stripe-webhook {
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
        client_max_body_size 1m;
    }

    # -------------------------------------------------------------------------
    # Auth endpoints — strict rate limiting (brute-force protection layer 1).
    # Application-level lockout (Redis) is layer 2, in routers/auth.py.
    # -------------------------------------------------------------------------
    location /v1/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # Also match the actual prefix your routers use (/api/v1/auth/)
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;
        add_header Retry-After 60 always;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # -------------------------------------------------------------------------
    # File upload presigned URL generation
    # -------------------------------------------------------------------------
    location /v1/uploads/ {
        limit_req zone=upload_limit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # -------------------------------------------------------------------------
    # Health check — no rate limiting, no auth, no logging noise.
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # -------------------------------------------------------------------------
    # General API endpoints
    # -------------------------------------------------------------------------
    location /v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass   http://fastapi_backend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # Reject anything not matched above.
    location / {
        return 404;
    }
}