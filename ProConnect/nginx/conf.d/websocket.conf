# =============================================================================
# conf.d/websocket.conf — WebSocket server block
# Handles: ws.yourdomain.com
# Tradie Platform — Production
# =============================================================================
#
# WHY A SEPARATE SUBDOMAIN FOR WEBSOCKETS:
# WebSocket connections are long-lived — a connected tradie or user holds a
# connection open for the duration of a job. Mixing this with the REST API
# upstream makes load balancing harder (sticky connections skew traffic).
# A dedicated subdomain also lets you scale WebSocket capacity independently.
#
# WHAT USES THIS:
#   - Live ETA updates: tradie GPS position → user's "on my way" screen
#   - Job status changes: tradie accepted, tradie arrived, job complete
#   - Scope change approval: real-time notification to user
#   - Emergency broadcast: simultaneous push to multiple tradies
#
# ARCHITECTURE:
# Client connects to wss://ws.yourdomain.com/ws/{job_id}
# nginx proxies to FastAPI, which manages the WebSocket connection.
# FastAPI subscribes to a Redis Pub/Sub channel for that job_id.
# Celery tasks publish to Redis when job events occur.
# FastAPI forwards the event to the connected client.
# =============================================================================

# Map to set the Upgrade header correctly.
# If the client sends an Upgrade header, pass it through.
# If not (e.g. health check), set it to empty string.
map $http_upgrade $connection_upgrade {
    default  upgrade;
    ""       close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ws.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;

    # -------------------------------------------------------------------------
    # Rate limit — WebSocket connection attempts, not messages.
    # Once connected, there is no per-message rate limit at nginx level.
    # FastAPI handles per-connection message throttling.
    # -------------------------------------------------------------------------
    limit_req  zone=ws_limit burst=5 nodelay;
    limit_conn conn_limit_per_ip 10;  # Max 10 simultaneous WS connections per IP.

    # -------------------------------------------------------------------------
    # WebSocket proxy location
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://fastapi_backend;

        # --- Critical WebSocket headers ---
        # These are what tell nginx to upgrade the HTTP connection to WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Request-ID       $request_id;

        # --- WebSocket timeout settings ---
        # proxy_read_timeout: how long nginx waits for a message from the
        # upstream before closing the connection. For WebSockets, this is
        # effectively the idle timeout. Set to 1 hour.
        # A well-behaved WS server sends a ping every 30s to keep it alive.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 5s;

        # Disable buffering — WebSocket messages must be sent immediately.
        proxy_buffering off;

        # CORS for WebSocket handshake
        # The initial HTTP upgrade request is a regular HTTP request and
        # is subject to CORS. Allow only the frontend origin.
        set $cors_ws_origin "";
        if ($http_origin ~* "^https://app\.yourdomain\.com$") {
            set $cors_ws_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin      $cors_ws_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # -------------------------------------------------------------------------
    # Health check — FastAPI /health endpoint, not a WebSocket connection.
    # Used by deploy.sh to verify the backend is alive.
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://fastapi_backend;
        include    /etc/nginx/conf.d/_proxy_params.conf;
    }

    # Reject everything else.
    location / {
        return 404;
    }
}