# =============================================================================
# nginx.conf — Main configuration
# Tradie Platform — Production
# =============================================================================

user nginx;

# Auto-detect number of CPU cores. Never hardcode this.
worker_processes auto;

# Each worker opens this many simultaneous connections.
# 1024 is the right value for a 4-core server at launch scale.
# Raise to 4096 when you move to Stage 2 (500–2000 users).
worker_connections 1024;

# Accept as many connections as possible per worker wake-up.
multi_accept on;

# Use epoll — the most efficient I/O event model on Linux.
use epoll;

pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

# =============================================================================
# HTTP block — all web traffic configuration
# =============================================================================
http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Security: never expose nginx version in response headers or error pages.
    # Attackers use version info to find known vulnerabilities.
    # -------------------------------------------------------------------------
    server_tokens off;

    # -------------------------------------------------------------------------
    # Logging — JSON format for structured log aggregation (Papertrail/Logtail).
    # Every log line includes request_id so you can trace a request end-to-end.
    # -------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;   # Send headers and beginning of a file in one packet.
    tcp_nodelay     on;   # Disable Nagle algorithm for keep-alive connections.
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # Gzip compression — reduces bandwidth for JSON API responses significantly.
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Request size limits
    # Max body for general API requests: 10MB (covers before/after photo upload
    # metadata, but actual photos go direct to S3 via presigned URLs so this
    # limit never applies to them in practice).
    # -------------------------------------------------------------------------
    client_max_body_size 10m;
    client_body_timeout  30s;   # Kill slow-body / Slowloris attacks.
    client_header_timeout 15s;
    send_timeout 30s;

    # -------------------------------------------------------------------------
    # Rate limit zones — defined once here, referenced in server blocks.
    #
    # Zone naming convention: limit_<scope>_<endpoint_type>
    #
    # binary_remote_addr: store the IP as 4 bytes (IPv4) or 16 bytes (IPv6)
    #   instead of the full string — saves memory.
    # zone=name:size  — shared memory zone name and size.
    #   1MB stores approximately 16,000 IPs.
    # rate=N r/m or r/s — allowed rate.
    # -------------------------------------------------------------------------

    # Auth endpoints (login, register, password reset) — 5 requests/minute.
    # This is the brute-force protection layer at nginx. FastAPI adds a second
    # Redis-backed layer on top of this.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # General API endpoints — 100 requests/minute per IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # WebSocket connection attempts — 10 per minute per IP.
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/m;

    # File upload endpoints — 20 requests/minute (presigned URL generation).
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;

    # Simultaneous open connections per IP — defence against connection floods.
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # -------------------------------------------------------------------------
    # Request ID - injected into every request so logs in nginx and FastAPI
    # can be correlated by a single ID.
    # -------------------------------------------------------------------------
    map $http_x_request_id $request_id {
        default $http_x_request_id;
        ""      $request_uid;
    }

    # Generate a unique ID when the client does not send one.
    # Requires the nginx_http_random_index_module or lua. We use a simpler
    # approach: assign $msec.$connection.$connection_requests as a UID.
    # In production, use openresty or add the headers-more module if you need
    # true UUIDs. For launch this is sufficient.
    map $msec $request_uid {
        default "${msec}_${connection}_${connection_requests}";
    }

    # -------------------------------------------------------------------------
    # Real IP — when traffic comes through Cloudflare, the client IP in nginx
    # is Cloudflare's IP, not the user's. This block tells nginx to trust
    # Cloudflare's X-Forwarded-For header and use it as the real client IP.
    # Without this, your rate limits apply to Cloudflare's IP, not the attacker.
    # Update this list from: https://www.cloudflare.com/ips/
    # -------------------------------------------------------------------------
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;

    # -------------------------------------------------------------------------
    # Include all subdomain config files.
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
