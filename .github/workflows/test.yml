name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Direct pip install — no package build system.
      # Your backend is a FastAPI app, not a Python library.
      # pip install ".[dev]" tried to build a wheel and failed.
      - name: Install dependencies
        working-directory: hipages/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            pytest-cov==6.0.0 \
            ruff==0.8.4 \
            asgi-lifespan==2.1.0

      - name: Lint with ruff
        working-directory: hipages/backend
        run: ruff check .
        continue-on-error: true

      - name: Run Alembic migrations
        working-directory: hipages/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: alembic upgrade head

      - name: Run tests
        working-directory: hipages/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          DEBUG:                 "true"
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS:   "7"
          FIELD_ENCRYPTION_KEY:  ""
          SENTRY_BACKEND_DSN:    ""
          STRIPE_SECRET_KEY:     sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY:        ""
          TWILIO_ACCOUNT_SID:    ""
          TWILIO_AUTH_TOKEN:     ""
          R2_ACCOUNT_ID:         test
          R2_ACCESS_KEY_ID:      test
          R2_SECRET_ACCESS_KEY:  test
          R2_BUCKET_NAME:        test-bucket
          R2_PUBLIC_URL:         http://localhost
        run: |
          PYTHONPATH=. pytest tests/ \
            --asyncio-mode=auto \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: hipages/backend/coverage.xml
          retention-days: 7

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hipages/frontend/package-lock.json

      - name: Install dependencies
        working-directory: hipages/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        working-directory: hipages/frontend
        env:
          # Required at build time for NEXT_PUBLIC_ variables
          NEXT_PUBLIC_API_URL:      http://localhost:8000
          NEXT_PUBLIC_WS_URL:       ws://localhost:8000
          NEXT_PUBLIC_STRIPE_KEY:   pk_test_placeholder
          NEXT_TELEMETRY_DISABLED:  "1"
          NODE_ENV:                 production
        run: npm run build
