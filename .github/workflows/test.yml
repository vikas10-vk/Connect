name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Direct pip install — no package build system.
      # Your backend is a FastAPI app, not a Python library.
      # pip install ".[dev]" tried to build a wheel and failed.
      - name: Install dependencies
        working-directory: hipages/backend
        run: |
          python -m pip install --upgrade pip

          pip install "fastapi==0.135.1" "uvicorn[standard]==0.42.0" "gunicorn==25.1.0"

          pip install "sqlalchemy[asyncio]==2.0.48" "asyncpg==0.30.0" "alembic==1.14.0" "psycopg2-binary==2.9.11"

          pip install "pydantic==2.12.5" "pydantic-settings==2.13.1" "python-dotenv==1.2.2" "email-validator==2.3.0"

          pip install "python-jose[cryptography]==3.5.0" "cryptography==46.0.5"

          # redis without [hiredis] and celery without [redis] — avoids
          # the kombu version conflict (kombu requires redis<6.5, we use 7.3.0)
          pip install "redis==7.3.0" "celery==5.6.2"

          pip install "httpx==0.28.1" "python-multipart==0.0.22" "python-dateutil==2.9.0" "orjson"

          pip install "sentry-sdk[fastapi]==2.56.0"

          pip install "pytest==8.3.4" "pytest-asyncio==0.24.0" "pytest-cov==6.0.0"

          pip install "ruff==0.8.4"

      - name: Lint with ruff
        working-directory: hipages/backend
        run: ruff check .
        continue-on-error: true

      - name: Run Alembic migrations
        working-directory: hipages/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: alembic upgrade head

      - name: Run tests
        working-directory: hipages/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          DEBUG:                 "true"
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS:   "7"
          FIELD_ENCRYPTION_KEY:  ""
          SENTRY_BACKEND_DSN:    ""
          STRIPE_SECRET_KEY:     sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY:        ""
          TWILIO_ACCOUNT_SID:    ""
          TWILIO_AUTH_TOKEN:     ""
          R2_ACCOUNT_ID:         test
          R2_ACCESS_KEY_ID:      test
          R2_SECRET_ACCESS_KEY:  test
          R2_BUCKET_NAME:        test-bucket
          R2_PUBLIC_URL:         http://localhost
        run: |
          PYTHONPATH=. pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: hipages/backend/coverage.xml
          retention-days: 7

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check frontend exists
        id: check_frontend
        run: |
          if [ -f "hipages/frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No frontend/package.json found — skipping build"
          fi

      - name: Set up Node.js 20
        if: steps.check_frontend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        if: steps.check_frontend.outputs.exists == 'true'
        working-directory: hipages/frontend
        env:
          NEXT_PUBLIC_API_URL:     http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build