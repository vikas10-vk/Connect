name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install production deps from requirements.txt then add test/dev tooling.
      # asgi-lifespan is installed here (also in requirements-dev.txt for local use).
      - name: Install dependencies
        working-directory: ProConnect/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            pytest-cov==6.0.0 \
            ruff==0.8.4 \
            asgi-lifespan==2.1.0

      # Lint check — now enforced (not continue-on-error).
      # Fix lint errors with: ruff check --fix .
      - name: Lint with ruff
        working-directory: ProConnect/backend
        run: ruff check .

      - name: Run Alembic migrations
        working-directory: ProConnect/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: alembic upgrade head

      # Seed canonical trade categories so category-slug resolution works in tests.
      # Without this, POST /jobs/ with any category_slug returns 400.
      - name: Seed categories
        working-directory: ProConnect/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: python -m seeds.seed_categories

      # Smoke test: verifies the Celery app path that docker-compose.prod.yml
      # uses (`celery -A workers.celery_app:celery_app`) actually imports and
      # boots. A misnamed module path (the old `app.celery_app`) fails here.
      - name: Celery boot smoke test
        working-directory: ProConnect/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
        run: |
          set -e
          # 1. The Celery app module must import at the exact path prod uses.
          PYTHONPATH=. python -c "from workers.celery_app import celery_app; print('Celery app:', celery_app.main); assert celery_app.tasks, 'no tasks registered'"
          # 2. Boot a real worker against Redis, confirm it answers a ping, stop it.
          PYTHONPATH=. celery -A workers.celery_app:celery_app worker --pool=solo --concurrency=1 --loglevel=info &
          WORKER_PID=$!
          for i in $(seq 1 20); do
            if PYTHONPATH=. celery -A workers.celery_app:celery_app inspect ping --timeout 5 >/dev/null 2>&1; then
              echo "Celery worker booted and responded to ping"
              kill "$WORKER_PID" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "Celery worker did not respond within timeout"
          kill "$WORKER_PID" 2>/dev/null || true
          exit 1

      - name: Run tests
        working-directory: ProConnect/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          DEBUG:                 "true"
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS:   "7"
          FIELD_ENCRYPTION_KEY:  ""
          SENTRY_BACKEND_DSN:    ""
          STRIPE_SECRET_KEY:     sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY:        ""
          TWILIO_ACCOUNT_SID:    ""
          TWILIO_AUTH_TOKEN:     ""
          R2_ACCOUNT_ID:         test
          R2_ACCESS_KEY_ID:      test
          R2_SECRET_ACCESS_KEY:  test
          R2_BUCKET_NAME:        test-bucket
          R2_PUBLIC_URL:         http://localhost
        run: |
          PYTHONPATH=. pytest tests/ \
            --asyncio-mode=auto \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ProConnect/backend/coverage.xml
          retention-days: 7

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: A failing frontend build (including TypeScript and ESLint errors,
    # now that next.config.mjs no longer ignores them) is a release blocker
    # and must fail CI. No continue-on-error here.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ProConnect/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ProConnect/frontend
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        working-directory: ProConnect/frontend
        env:
          # Required at build time for NEXT_PUBLIC_ variables
          NEXT_PUBLIC_API_URL:      http://localhost:8000
          NEXT_PUBLIC_WS_URL:       ws://localhost:8000
          NEXT_PUBLIC_STRIPE_KEY:   pk_test_placeholder
          NEXT_TELEMETRY_DISABLED:  "1"
          NODE_ENV:                 production
        run: npm run build
