name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Tests — must pass before any deploy happens
  # ============================================================================
  test:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: hipages/backend
        run: |
        
          python -m pip install --upgrade pip
          pip install "fastapi==0.135.1" "uvicorn[standard]==0.42.0" "gunicorn==25.1.0"
          pip install "sqlalchemy[asyncio]==2.0.48" "asyncpg==0.30.0" "alembic==1.14.0" "psycopg2-binary==2.9.11"
          pip install "pydantic==2.12.5" "pydantic-settings==2.13.1" "python-dotenv==1.2.2" "email-validator==2.3.0"
          pip install "python-jose[cryptography]==3.5.0" "cryptography==46.0.5" "bcrypt==4.0.1"
          pip install "redis==7.3.0" "celery==5.6.2"
          pip install "httpx==0.28.1" "python-multipart==0.0.22" "python-dateutil==2.9.0" "orjson" "stripe" "boto3"
          pip install "sentry-sdk[fastapi]==2.56.0"
          pip install "pytest==8.3.4" "pytest-asyncio==0.24.0" "pytest-cov==6.0.0" "ruff==0.8.4"

      - name: Lint
        working-directory: hipages/backend
        run: ruff check .
        continue-on-error: true

      - name: Run migrations
        working-directory: hipages/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: alembic upgrade head

      - name: Run tests
        working-directory: hipages/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          DEBUG:                 "true"
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          FIELD_ENCRYPTION_KEY:  ""
          SENTRY_BACKEND_DSN:    ""
          STRIPE_SECRET_KEY:     sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          R2_ACCOUNT_ID:         test
          R2_ACCESS_KEY_ID:      test
          R2_SECRET_ACCESS_KEY:  test
          R2_BUCKET_NAME:        test-bucket
          R2_PUBLIC_URL:         http://localhost
        run: PYTHONPATH=. pytest tests/ --tb=short -q --cov-fail-under=0

  # ============================================================================
  # Job 2: Build and push Docker images
  # ============================================================================
  build:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./hipages/backend
          file: ./hipages/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./hipages/frontend
          file: ./hipages/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/frontend:buildcache,mode=max

      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: ./hipages/admin
          file: ./hipages/admin/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/admin:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/admin:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/admin:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/admin:buildcache,mode=max

  # ============================================================================
  # Job 3: Deploy to production server
  # Skipped automatically if SERVER_HOST / SERVER_SSH_KEY secrets are not set.
  # Add those secrets once you have your server — deploys will then run.
  # ============================================================================
  deploy:
    name: Deploy to production
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy.sh to server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            hipages/deploy.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/deploy.sh

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash /home/${{ secrets.SERVER_USER }}/deploy.sh \
              ${{ needs.build.outputs.image_tag }} \
              ghcr.io/${{ github.repository }} \
              ${{ github.sha }} \
              '${{ github.event.head_commit.message }}'"

      - name: Notify Slack — success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ *Deploy succeeded* — `${{ needs.build.outputs.image_tag }}`\nCommit: ${{ github.event.head_commit.message }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ *Deploy FAILED* — `${{ needs.build.outputs.image_tag }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
