name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false
        default: "Manual trigger"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Job 1: Tests — must pass before any deploy happens
  # ============================================================================
  test:
    name: Run tests before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: ProConnect/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install \
            pytest==8.3.4 \
            pytest-asyncio==0.24.0 \
            pytest-cov==6.0.0 \
            ruff==0.8.4 \
            asgi-lifespan==2.1.0

      - name: Lint with ruff
        working-directory: ProConnect/backend
        run: ruff check .
        continue-on-error: true

      - name: Run migrations
        working-directory: ProConnect/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: alembic upgrade head

      # Seed canonical trade categories so category-slug resolution tests pass.
      # This step is required — tests that call POST /jobs/ with a category_slug
      # will fail with 400 if the DB has no categories.
      - name: Seed categories
        working-directory: ProConnect/backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: python -m seeds.seed_categories

      - name: Run tests
        working-directory: ProConnect/backend
        env:
          DATABASE_URL:          postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:             redis://localhost:6379/0
          CELERY_BROKER_URL:     redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:           test
          DEBUG:                 "true"
          SECRET_KEY:            ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:             HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          FIELD_ENCRYPTION_KEY:  ""
          SENTRY_BACKEND_DSN:    ""
          STRIPE_SECRET_KEY:     sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          R2_ACCOUNT_ID:         test
          R2_ACCESS_KEY_ID:      test
          R2_SECRET_ACCESS_KEY:  test
          R2_BUCKET_NAME:        test-bucket
          R2_PUBLIC_URL:         http://localhost
        run: PYTHONPATH=. pytest tests/ --tb=short -q --cov-fail-under=0

  # ============================================================================
  # Job 2: Build and push Docker images
  # ============================================================================
  build:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # -----------------------------------------------------------------------
      # Backend — uses the production multi-stage Dockerfile (not Dockerfile.dev)
      # Image name: "fastapi" to match docker-compose.prod.yml references
      # -----------------------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./ProConnect/backend
          file: ./ProConnect/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/fastapi:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/fastapi:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/fastapi:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/fastapi:buildcache,mode=max

      # -----------------------------------------------------------------------
      # Frontend — uses the existing production multi-stage Dockerfile
      # Image name: "nextjs" to match docker-compose.prod.yml references
      # -----------------------------------------------------------------------
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./ProConnect/frontend
          file: ./ProConnect/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/nextjs:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/nextjs:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/nextjs:buildcache
          cache-to:   type=registry,ref=ghcr.io/${{ github.repository }}/nextjs:buildcache,mode=max

  # ============================================================================
  # Job 3: Deploy to production server
  # Skipped automatically if SERVER_HOST / SERVER_SSH_KEY secrets are not set.
  # Add those secrets once you have your server — deploys will then run.
  # ============================================================================
  deploy:
    name: Deploy to production
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy deploy.sh to server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ProConnect/deploy.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/deploy.sh

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "bash /home/${{ secrets.SERVER_USER }}/deploy.sh \
              ${{ needs.build.outputs.image_tag }} \
              ghcr.io/${{ github.repository }} \
              ${{ github.sha }} \
              '${{ github.event.head_commit.message }}'"

      - name: Notify Slack — success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ *Deploy succeeded* — `${{ needs.build.outputs.image_tag }}`\nCommit: ${{ github.event.head_commit.message }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "❌ *Deploy FAILED* — `${{ needs.build.outputs.image_tag }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
