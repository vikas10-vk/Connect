# =============================================================================
# conf.d/_proxy_params.conf — Shared proxy settings
# Included by every location block that proxies to an upstream.
# Prefixed with _ so it sorts first and is clearly a helper, not a server block.
# =============================================================================

# Use HTTP/1.1 for upstream connections — required for keepalive to work.
proxy_http_version 1.1;

# Required for HTTP/1.1 keepalive — clears the 'Connection: close' default.
proxy_set_header Connection "";

# Forward the real client IP to the application.
# FastAPI reads X-Forwarded-For to log the client's real IP.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;

# Tell the application it is behind HTTPS even though the upstream
# connection from nginx → FastAPI is plain HTTP inside Docker.
proxy_set_header X-Forwarded-Proto $scheme;

# Forward the original Host header so FastAPI can validate it.
proxy_set_header Host              $host;

# Forward the request ID — this is how you trace a single request
# through nginx logs, FastAPI logs, and Celery task logs.
proxy_set_header X-Request-ID      $request_id;
add_header       X-Request-ID      $request_id always;

# Timeouts
proxy_connect_timeout 5s;    # Time to establish connection to upstream.
proxy_send_timeout    60s;   # Time to send request to upstream.
proxy_read_timeout    60s;   # Time to read response from upstream.
                              # 60s is generous — raise it only for specific
                              # long-running endpoints (e.g. report generation).

# Buffer settings — prevent nginx from waiting for a full upstream response
# before starting to send to the client.
proxy_buffering           on;
proxy_buffer_size         8k;
proxy_buffers             8 8k;
proxy_busy_buffers_size   16k;

# Do not pass upstream error pages through — nginx handles them.
# This prevents your FastAPI error HTML leaking when the upstream is down.
proxy_intercept_errors on;

# Error pages shown to clients when upstream is unreachable.
error_page 502 503 504 /50x.json;