# =============================================================================
# conf.d/redirect-http.conf — HTTP → HTTPS redirect
# Handles: all subdomains on port 80
# Tradie Platform — Production
# =============================================================================
#
# WHY A CATCH-ALL SERVER BLOCK ON PORT 80:
# Any HTTP request to any of your subdomains is immediately redirected to HTTPS.
# This handles:
#   - Old bookmarks pointing to http://
#   - Email links that strip the s from https
#   - Search engine crawlers that try http first
#   - Let's Encrypt ACME challenge (/.well-known/acme-challenge/) for cert renewal
#
# The 301 (Permanent Redirect) tells browsers to always use HTTPS for this URL
# in future and update any bookmarks.
# =============================================================================

server {
    listen 80;
    listen [::]:80;   # IPv6.

    # Catch all subdomains. server_name _ means "match any hostname not matched
    # by a more specific server block".
    server_name _;

    # -------------------------------------------------------------------------
    # Let's Encrypt certificate renewal.
    # Certbot writes challenge files to this directory to prove domain ownership.
    # This location must be accessible over HTTP (not redirected).
    # nginx serves the files directly, Certbot verifies them, cert gets renewed.
    # -------------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        # This directory is a Docker volume shared between nginx and certbot.
        # In docker-compose.prod.yml:
        #   volumes:
        #     - ./certbot/www:/var/www/certbot:ro
    }

    # -------------------------------------------------------------------------
    # Redirect everything else to HTTPS.
    # $host preserves the subdomain (api., app., admin., ws.)
    # $request_uri preserves the path and query string.
    # -------------------------------------------------------------------------
    location / {
        return 301 https://$host$request_uri;
    }
}