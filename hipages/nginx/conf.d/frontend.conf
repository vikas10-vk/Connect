# =============================================================================
# conf.d/frontend.conf — Next.js frontend server block
# Handles: app.yourdomain.com
# Tradie Platform — Production
# =============================================================================

server {
    listen 443 ssl;
    http2 on;
    server_name app.yourdomain.com;

    # -------------------------------------------------------------------------
    # SSL — same certificate as API if using a wildcard cert (*.yourdomain.com).
    # If using individual certs, run: certbot --nginx -d app.yourdomain.com
    # -------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;   # SAMEORIGIN (not DENY) for Next.js iframes.
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # Content Security Policy — the most important frontend security header.
    #
    # Explanation of each directive:
    #   default-src 'self'         — by default, only load from same origin.
    #   script-src                 — allow Next.js built scripts + Stripe.js.
    #                                'unsafe-inline' is needed only if you use
    #                                inline scripts. Remove it if you can.
    #   style-src                  — allow inline styles (Next.js uses them).
    #   img-src                    — allow images from S3/CloudFront + data URIs.
    #   font-src                   — allow fonts from your CDN.
    #   connect-src                — allow API and WebSocket connections.
    #   frame-src                  — allow Stripe embedded payment forms.
    #   worker-src                 — allow service workers (Next.js PWA).
    #   base-uri 'self'            — prevent base tag injection attacks.
    #   form-action 'self'         — only submit forms to same origin.
    #   frame-ancestors 'none'     — this page cannot be iframed (clickjacking).
    #   upgrade-insecure-requests  — auto-upgrade HTTP → HTTPS for sub-resources.
    #
    # CHANGE: Replace cdn.yourdomain.com and *.stripe.com with your actual CDN
    # and any third-party domains your frontend loads resources from.
    # -------------------------------------------------------------------------
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://js.stripe.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/;
        style-src   'self' 'unsafe-inline';
        img-src     'self' data: blob: https://*.yourdomain.com https://cdn.yourdomain.com;
        font-src    'self' https://cdn.yourdomain.com;
        connect-src 'self' https://api.yourdomain.com wss://ws.yourdomain.com https://sentry.io;
        frame-src   https://js.stripe.com https://hooks.stripe.com https://www.google.com/recaptcha/;
        worker-src  'self' blob:;
        base-uri    'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    " always;

    add_header Permissions-Policy "camera=self, microphone=(), geolocation=self, payment=(self https://js.stripe.com)" always;

    # -------------------------------------------------------------------------
    # Connection limit
    # -------------------------------------------------------------------------
    limit_conn conn_limit_per_ip 20;

    # -------------------------------------------------------------------------
    # Next.js static assets — aggressive caching.
    # Next.js puts content-hashed filenames in /_next/static/ so these files
    # are safe to cache for a full year. The hash changes when content changes.
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass   http://nextjs_frontend;
        include      /etc/nginx/conf.d/_proxy_params.conf;

        # Cache for 1 year — these files are content-addressed.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;   # Static assets do not need to be in access logs.
    }

    # -------------------------------------------------------------------------
    # Public static files (favicon, robots.txt, og-image, etc.)
    # -------------------------------------------------------------------------
    location /static/ {
        proxy_pass   http://nextjs_frontend;
        include      /etc/nginx/conf.d/_proxy_params.conf;

        add_header Cache-Control "public, max-age=86400" always;  # 1 day.
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Health check — for deploy.sh smoke tests.
    # -------------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass   http://nextjs_frontend;
        include      /etc/nginx/conf.d/_proxy_params.conf;
    }

    # -------------------------------------------------------------------------
    # All other routes — proxy to Next.js (app router handles routing).
    # No caching on HTML responses — Next.js manages its own cache headers
    # via generateStaticParams and revalidate.
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass   http://nextjs_frontend;
        include      /etc/nginx/conf.d/_proxy_params.conf;

        # Do not cache Next.js HTML pages at nginx level.
        # Let Next.js and the browser negotiate cache via its own headers.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}