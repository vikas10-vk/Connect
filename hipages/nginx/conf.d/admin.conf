# =============================================================================
# conf.d/admin.conf — Django admin server block
# Handles: admin.yourdomain.com
# Tradie Platform — Production
# =============================================================================
#
# CRITICAL SECURITY: This subdomain is IP-whitelisted.
# It is completely unreachable from any IP not in the allow list below.
# An attacker who finds the admin URL gets a 403 before nginx even processes
# the request — nothing leaks, not even the login page.
#
# HOW TO ADD YOUR IP:
#   1. Find your office/home IP: curl ifconfig.me
#   2. Add it to the allow list below.
#   3. For dynamic IPs, use a VPN with a fixed exit IP and whitelist that.
#   4. Reload nginx: docker compose exec nginx nginx -s reload
#
# IMPORTANT: Test the whitelist from a non-whitelisted IP before going live.
#   curl -I https://admin.yourdomain.com   (from a mobile connection, not office)
#   Expected result: connection refused or 403
# =============================================================================

# -------------------------------------------------------------------------
# Geo block — define which IPs are allowed.
# All unlisted IPs get $admin_allowed = 0 (blocked).
# -------------------------------------------------------------------------
geo $admin_allowed {
    default         0;   # Block everyone by default.

    # ----- ADD YOUR ALLOWED IPs HERE -----
    # Format: <IP or CIDR>   1;
    # Examples:
    #   1.2.3.4/32     1;   # Single IP
    #   10.0.0.0/8     1;   # Office subnet
    #   203.0.113.0/24 1;   # VPN exit range

    49.37.162.38/32    1;
    # YOUR_HOME_IP/32      1;
    # YOUR_VPN_EXIT_IP/32  1;

    127.0.0.1       1;   # Localhost (for testing via SSH tunnel).
    ::1             1;   # IPv6 localhost.
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # -------------------------------------------------------------------------
    # IP whitelist enforcement — checked before anything else.
    # -------------------------------------------------------------------------
    if ($admin_allowed = 0) {
        return 403;
    }

    # -------------------------------------------------------------------------
    # Security headers — stricter than frontend because admin is higher risk.
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Very restrictive CSP for admin — only load from same origin.
    # Django admin uses inline styles and scripts unfortunately, so we
    # need unsafe-inline. Mitigated by the IP whitelist.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline';
        img-src     'self' data:;
        font-src    'self';
        connect-src 'self';
        frame-ancestors 'none';
    " always;

    # -------------------------------------------------------------------------
    # Rate limit — even whitelisted IPs should not be able to brute force.
    # The Django admin also has its own login attempt throttling via django-otp.
    # -------------------------------------------------------------------------
    limit_conn conn_limit_per_ip 5;
    limit_req  zone=auth_limit burst=2 nodelay;

    # -------------------------------------------------------------------------
    # Proxy to Django admin
    # -------------------------------------------------------------------------
    location / {
        proxy_pass   http://django_admin;
        include      /etc/nginx/conf.d/_proxy_params.conf;

        # Django admin sessions should not be cached.
        add_header Cache-Control "no-store, private" always;
    }

    # -------------------------------------------------------------------------
    # Django admin static files (CSS/JS for the admin interface).
    # These are served by whitenoise or collected to a static dir.
    # -------------------------------------------------------------------------
    location /static/admin/ {
        proxy_pass   http://django_admin;
        include      /etc/nginx/conf.d/_proxy_params.conf;
        add_header   Cache-Control "public, max-age=86400" always;
        access_log   off;
    }
}