# =============================================================================
# conf.d/upstreams.conf — Upstream server pools
# Tradie Platform — Production
# =============================================================================
#
# WHY TWO FASTAPI INSTANCES:
# Zero-downtime deployment requires at least two app instances. When deploying,
# we update fastapi_1 first, wait for its health check, then update fastapi_2.
# Nginx never has a moment where all backends are unavailable.
#
# Docker Compose service names resolve as hostnames inside the Docker network.
# fastapi_1 and fastapi_2 are separate container instances of the same image,
# defined in docker-compose.prod.yml.
# =============================================================================

# -----------------------------------------------------------------------------
# FastAPI backend — primary API (api.yourdomain.com)
# -----------------------------------------------------------------------------
upstream fastapi_backend {
    # Round-robin load balancing (default). Both containers get equal traffic.
    server fastapi_1:8000;
    server fastapi_2:8000;

    # If a backend fails to respond in 5s or returns a 500/502/503/504,
    # mark it as temporarily unavailable and send traffic to the other instance.
    # This is what makes zero-downtime deployment work.
    # The failed instance gets retried after 10 seconds.
    # NOTE: 'fail_timeout' and 'max_fails' require the upstream module which
    # is included in standard nginx builds.
    # Uncomment below if you add nginx Plus or use nginx with upstream_hash:
    # keepalive 32;  -- persistent connections to upstream (needs HTTP/1.1)

    # Keepalive connections to upstream servers.
    # Reduces connection setup overhead for high-frequency API calls.
    keepalive 32;
}

# -----------------------------------------------------------------------------
# Next.js frontend — public app (app.yourdomain.com)
# Single instance at launch. Add nextjs_2 when you reach Stage 2.
# -----------------------------------------------------------------------------
upstream nextjs_frontend {
    server nextjs:3000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Celery Flower — task queue monitor (internal use only)
# Only accessible via SSH tunnel in production. Not exposed publicly.
# Uncomment and add an IP-whitelisted server block if you want browser access.
