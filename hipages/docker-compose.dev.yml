# =============================================================================
# docker-compose.dev.yml — Local development stack
# Tradie Platform
# =============================================================================
#
# SERVICES AND PORTS:
#   FastAPI      → http://localhost:8000
#   Next.js      → http://localhost:3000
#   PostgreSQL   → localhost:5432
#   Redis        → localhost:6379
#   Flower       → http://localhost:5555
#   Mailpit      → http://localhost:8025 (view outgoing emails)
#   pgAdmin      → http://localhost:5050 (docker compose --profile tools up)
#
# FIRST TIME SETUP:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. docker compose -f docker-compose.dev.yml exec fastapi alembic upgrade head
#   3. docker compose -f docker-compose.dev.yml exec fastapi python scripts/seed_dev.py
# =============================================================================

name: tradie-dev

networks:
  dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tradie_dev_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tradie_dev
      POSTGRES_USER: tradie
      POSTGRES_PASSWORD: tradie_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/db_init:/docker-entrypoint-initdb.d:ro

    networks:
      - dev_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tradie -d tradie_dev" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tradie_dev_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_dev_data:/data

    networks:
      - dev_network

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI — hot reload, code mounted as volume
  # FIX 1: was "uvicorn app.main:app" — no app/ package exists.
  #         main.py lives at the root of ./backend → "uvicorn main:app"
  # FIX 2: was JWT_SECRET_KEY → app reads SECRET_KEY
  # FIX 3: was JWT_ALGORITHM  → app reads ALGORITHM
  # FIX 4: AWS vars replaced with Cloudflare R2 vars (what the app actually uses)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: tradie_dev_fastapi
    restart: unless-stopped

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

    environment:
      ENVIRONMENT: development
      DEBUG: "true"

      # Database
      DATABASE_URL: postgresql+asyncpg://tradie:tradie_dev_password@postgres:5432/tradie_dev

      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

      # Auth — FIX: app reads SECRET_KEY and ALGORITHM (not JWT_ prefix)
      SECRET_KEY: dev-secret-key-never-use-in-production-replace-with-32-chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"

      # Stripe (test keys)
      STRIPE_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-pk_test_placeholder}

      # Cloudflare R2 — FIX: was AWS vars. App uses R2 (S3-compatible via boto3)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-dev_account_id}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-dev_access_key}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-dev_secret_key}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-tradie-dev-bucket}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-http://localhost}

      # Email — Mailpit catches everything locally, no real emails sent
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"

      # Twilio (test credentials)
      TWILIO_ACCOUNT_SID: ${TWILIO_TEST_ACCOUNT_SID:-AC_placeholder}
      TWILIO_AUTH_TOKEN: ${TWILIO_TEST_AUTH_TOKEN:-placeholder}

      # AI — Groq (required for Step 3 job-brief analysis)
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # Optional — leave blank to disable in dev
      SENTRY_BACKEND_DSN: ""
      FIELD_ENCRYPTION_KEY: ""
      RESEND_API_KEY: ""

      LOG_LEVEL: DEBUG

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - /app/.venv

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - dev_network

  # ---------------------------------------------------------------------------
  # Next.js — hot reload
  # ---------------------------------------------------------------------------
  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    container_name: tradie_dev_nextjs
    restart: unless-stopped

    command: npm run dev

    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://fastapi:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_TEST_PUBLISHABLE_KEY:-pk_test_placeholder}
      NEXT_TELEMETRY_DISABLED: "1"

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    networks:
      - dev_network


  # ---------------------------------------------------------------------------
  # Celery worker
  # FIX: was "celery -A app.celery_app" — no app/ package.
  #      celery_app.py lives at backend root → "celery -A celery_app"
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: tradie_dev_celery
    restart: unless-stopped

    command: celery -A workers.celery_app:celery_app worker --queues=critical,normal,bulk --concurrency=2 --loglevel=debug --logfile=/dev/stdout

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tradie:tradie_dev_password@postgres:5432/tradie_dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: dev-secret-key-never-use-in-production-replace-with-32-chars
      ALGORITHM: HS256
      STRIPE_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-sk_test_placeholder}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      FIELD_ENCRYPTION_KEY: ""
      GROQ_API_KEY: ${GROQ_API_KEY:-}

    volumes:
      - ./backend:/app
      - /app/.venv

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - dev_network

  # ---------------------------------------------------------------------------
  # Celery Beat — scheduler
  # FIX: was "celery -A app.celery_app" → "celery -A celery_app"
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: tradie_dev_celery_beat
    restart: unless-stopped

    command: celery -A workers.celery_app:celery_app beat --loglevel=debug --logfile=/dev/stdout

    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://tradie:tradie_dev_password@postgres:5432/tradie_dev
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    volumes:
      - ./backend:/app
      - /app/.venv

    depends_on:
      - redis

    networks:
      - dev_network

  # ---------------------------------------------------------------------------
  # Flower — Celery task monitor → http://localhost:5555
  # FIX: was "celery -A app.celery_app" → "celery -A celery_app"
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev

    container_name: tradie_dev_flower
    restart: unless-stopped

    command: celery -A workers.celery_app:celery_app flower --port=5555

    environment:
      DATABASE_URL: postgresql+asyncpg://tradie:tradie_dev_password@postgres:5432/tradie_dev
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2

    ports:
      - "5555:5555"

    depends_on:
      - redis

    networks:
      - dev_network

  # ---------------------------------------------------------------------------
  # Mailpit — catches all outgoing emails → http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tradie_dev_mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"
      - "1025:1025"

    networks:
      - dev_network

  # ---------------------------------------------------------------------------
  # pgAdmin — only starts when you explicitly run --profile tools
  # docker compose -f docker-compose.dev.yml --profile tools up pgadmin
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tradie_dev_pgadmin
    restart: unless-stopped
    profiles:
      - tools

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tradie.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "5050:80"

    networks:
      - dev_network
