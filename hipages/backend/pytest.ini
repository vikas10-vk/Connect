[pytest]
# asyncio_mode = auto is the critical setting.
#
# Without it, pytest-asyncio 0.21+ defaults to "strict" mode which requires
# @pytest.mark.asyncio on every async test method. Without the decorator,
# pytest-asyncio raises an error for every test — all tests fail regardless
# of whether the code under test is correct.
#
# auto mode: any async def test_... function is automatically treated as
# an async test. No decorator needed.
asyncio_mode = auto

# Add backend root to Python path so imports work without PYTHONPATH=. prefix
pythonpath = .

# Default test directory
testpaths = tests