# =============================================================================
# docker-compose.prod.yml — Production stack
# Tradie Platform
# =============================================================================
#
# SERVICES IN THIS FILE:
#   postgres          — primary database
#   redis             — cache + Celery broker + WebSocket pub/sub
#   fastapi_1         — API instance 1  (zero-downtime deploy)
#   fastapi_2         — API instance 2  (zero-downtime deploy)
#   nextjs            — Next.js frontend
#   django_admin      — Django admin panel
#   celery_critical   — Celery worker: payments, bookings (high priority)
#   celery_normal     — Celery worker: notifications, emails (normal priority)
#   celery_bulk       — Celery worker: reports, data jobs (low priority)
#   celery_beat       — Celery scheduler (periodic tasks)
#   flower            — Celery task monitor (internal, no public port)
#   nginx             — Reverse proxy, SSL termination, rate limiting
#   certbot           — Let's Encrypt SSL cert auto-renewal
#
# HOW TO RUN:
#   First time:
#     docker compose -f docker-compose.prod.yml up -d
#
#   Deploy new version (done by deploy.sh, not manually):
#     docker compose -f docker-compose.prod.yml up -d --no-deps fastapi_1
#     # wait for health check
#     docker compose -f docker-compose.prod.yml up -d --no-deps fastapi_2
#
#   View logs:
#     docker compose -f docker-compose.prod.yml logs -f fastapi_1
#
#   Check health of all services:
#     docker compose -f docker-compose.prod.yml ps
#
# SECRETS:
#   All secrets come from environment variables injected by GitHub Actions.
#   Never write real values into this file.
#   See .env.prod.example for the full list of required variables.
# =============================================================================

name: tradie-prod

# =============================================================================
# NETWORKS
# Two networks — internal (DB/cache) and proxy (nginx-facing).
# The database and Redis are on the internal network only.
# They are completely unreachable from outside the server.
# =============================================================================
networks:
  internal:
    driver: bridge
    internal: true # No outbound internet access from this network.
    ipam:
      config:
        - subnet: 172.20.0.0/24

  proxy:
    driver: bridge
    # This network CAN reach the internet (needed for outbound API calls
    # from FastAPI: Stripe, Twilio, FCM, S3).


    # =============================================================================
    # VOLUMES — named volumes for data persistence.
    # Docker manages these on the host. Data survives container restarts.
    # =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local
  nginx_logs:
    driver: local

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tradie_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Ensure UTF-8 encoding — required for international characters in
      # job descriptions, addresses, user names.
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"

    volumes:
      # Persist all database data across container restarts and upgrades.
      - postgres_data:/var/lib/postgresql/data

      # Mount our production-tuned postgresql.conf (from nginx/postgres/).
      # This overrides the default config built into the image.
      - ./nginx/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro

      # Initialisation scripts — run once when the DB is first created.
      # Place .sql files here to create extensions (uuid-ossp, pg_trgm, etc.)
      - ./scripts/db_init:/docker-entrypoint-initdb.d:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    networks:
      - internal

    # Health check — other services use depends_on condition: service_healthy
    # to wait for Postgres to be genuinely ready, not just started.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Resource limits — prevent a runaway query from taking down the whole server.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
        reservations:
          memory: 1G

    # Log rotation — prevent log files from filling the disk.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Redis — Celery broker, result backend, rate limiting, WebSocket pub/sub,
  #         session store, refresh token store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tradie_redis
    restart: unless-stopped

    # Start Redis with:
    #   - Password authentication (REDIS_PASSWORD from env)
    #   - Persistence: AOF (append-only file) — survives restarts
    #   - Max memory: 512MB with LRU eviction policy
    #     When Redis hits 512MB, it evicts the least-recently-used keys.
    #     This is fine for cache data. Celery task queues are not LRU-evictable
    #     (they are not cache) — we keep task data small for this reason.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --timeout 300

    volumes:
      - redis_data:/data

    networks:
      - internal

    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # FastAPI — Instance 1
  # IMPORTANT: fastapi_1 and fastapi_2 are identical in config.
  # They differ only in container_name. Nginx load-balances between them.
  # During deployment, they are updated one at a time (see deploy.sh).
  # ---------------------------------------------------------------------------
  fastapi_1:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_fastapi_1
    restart: unless-stopped

    environment:
      # Application
      APP_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      DEBUG: "false"
      ALLOWED_HOSTS: "api.${DOMAIN}"

      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

      # Security
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      # Encryption key for sensitive fields (phone_real, etc.)
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PLATFORM_FEE_PERCENT: "15"

      # AWS S3
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}

      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PROXY_SERVICE: ${TWILIO_PROXY_SERVICE}

      # Firebase (FCM push notifications)
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}

      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACES_SAMPLE_RATE: "0.1"

      # reCAPTCHA
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}

      # Instance identification — used in logs to know which container logged
      INSTANCE_ID: fastapi_1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ---------------------------------------------------------------------------
  # FastAPI — Instance 2 (identical to fastapi_1)
  # ---------------------------------------------------------------------------
  fastapi_2:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_fastapi_2
    restart: unless-stopped

    environment:
      APP_ENV: production
      APP_VERSION: ${IMAGE_TAG}
      DEBUG: "false"
      ALLOWED_HOSTS: "api.${DOMAIN}"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PLATFORM_FEE_PERCENT: "15"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PROXY_SERVICE: ${TWILIO_PROXY_SERVICE}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      INSTANCE_ID: fastapi_2

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # ---------------------------------------------------------------------------
  # Next.js — Frontend
  # ---------------------------------------------------------------------------
  nextjs:
    image: ghcr.io/${GITHUB_REPOSITORY}/nextjs:${IMAGE_TAG}
    container_name: tradie_nextjs
    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://ws.${DOMAIN}
      NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_RECAPTCHA_KEY: ${RECAPTCHA_SITE_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
      NEXT_PUBLIC_CLOUDFRONT_URL: https://${CLOUDFRONT_DOMAIN}

      # Internal — not exposed to browser (no NEXT_PUBLIC_ prefix)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://app.${DOMAIN}

    networks:
      - proxy

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s # Next.js takes longer to start than FastAPI.

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Django Admin
  # ---------------------------------------------------------------------------
  django_admin:
    image: ghcr.io/${GITHUB_REPOSITORY}/django:${IMAGE_TAG}
    container_name: tradie_django_admin
    restart: unless-stopped

    environment:
      DJANGO_ENV: production
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: "admin.${DOMAIN}"

      # Django admin uses its own read-optimised DB user.
      # This user has SELECT on most tables and write access only where needed.
      # Created in scripts/db_init/02_django_user.sql
      DATABASE_URL: postgresql://${DJANGO_DB_USER}:${DJANGO_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Django OTP (two-factor authentication) — required for all admin logins.
      OTP_TOTP_ISSUER: "Tradie Admin"

      SENTRY_DSN: ${SENTRY_DSN}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8001/health/ || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery — Critical queue worker
  # Handles: payment capture, booking confirmation, dispute escalation.
  # These tasks must not fail. They have max_retries=5 with exponential backoff.
  # This worker processes ONLY the 'critical' queue.
  # Run 2 workers so one failure does not stall all payments.
  # ---------------------------------------------------------------------------
  celery_critical:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_celery_critical
    restart: unless-stopped

    command: >
      celery -A app.celery_app worker --queues=critical --concurrency=4 --prefetch-multiplier=1 --loglevel=info --logfile=/dev/stdout --hostname=critical@%h --max-tasks-per-child=100

    # --prefetch-multiplier=1: worker only takes one task at a time from the
    # queue. Critical for fair processing — a slow task does not block others.
    # --max-tasks-per-child=100: restart worker process after 100 tasks.
    # Prevents memory leaks from accumulating over time.

    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: ${AWS_S3_REGION}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      SENTRY_DSN: ${SENTRY_DSN}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery — Normal queue worker
  # Handles: push notifications, emails, SMS, GPS event processing.
  # ---------------------------------------------------------------------------
  celery_normal:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_celery_normal
    restart: unless-stopped

    command: >
      celery -A app.celery_app worker --queues=normal --concurrency=8 --prefetch-multiplier=2 --loglevel=info --logfile=/dev/stdout --hostname=normal@%h --max-tasks-per-child=500

    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
      SENTRY_DSN: ${SENTRY_DSN}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Celery — Bulk queue worker
  # Handles: report generation, data exports, home health score pipeline,
  #          dead-letter watchdog, licence expiry checks.
  # Low concurrency — these are intentionally slow, non-urgent jobs.
  # ---------------------------------------------------------------------------
  celery_bulk:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_celery_bulk
    restart: unless-stopped

    command: >
      celery -A app.celery_app worker --queues=bulk --concurrency=2 --prefetch-multiplier=1 --loglevel=info --logfile=/dev/stdout --hostname=bulk@%h --max-tasks-per-child=50

    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SENTRY_DSN: ${SENTRY_DSN}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal
      - proxy

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Celery Beat — Periodic task scheduler
  # ONE instance only — ever. Running two beats causes duplicate task execution.
  # Handles: booking timeout expiry, payout release timer, licence expiry alerts,
  #          daily digest emails, dead-letter queue watchdog.
  # ---------------------------------------------------------------------------
  celery_beat:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_celery_beat
    restart: unless-stopped

    command: >
      celery -A app.celery_app beat --loglevel=info --logfile=/dev/stdout --scheduler redbeat.RedBeatScheduler

    # RedBeat scheduler stores schedule in Redis instead of a local file.
    # This means if the beat container restarts, it picks up where it left off.
    # It also prevents the duplicate-task problem if you accidentally run two beats.

    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDBEAT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - internal

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Flower — Celery task monitor
  # NOT publicly accessible — no port is published to the host.
  # Access via SSH tunnel only:
  #   ssh -L 5555:localhost:5555 user@your-server-ip
  #   Then open http://localhost:5555 in your browser.
  # ---------------------------------------------------------------------------
  flower:
    image: ghcr.io/${GITHUB_REPOSITORY}/fastapi:${IMAGE_TAG}
    container_name: tradie_flower
    restart: unless-stopped

    command: >
      celery -A app.celery_app flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD} --url_prefix=flower --persistent=True --db=/tmp/flower.db

    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2

    depends_on:
      - redis

    networks:
      - internal # Internal only — no proxy network, no public access.

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy, SSL, rate limiting
  # The ONLY service that publishes ports to the host (80 and 443).
  # Everything else is reachable only through nginx.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: tradie_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx

    depends_on:
      fastapi_1:
        condition: service_healthy
      fastapi_2:
        condition: service_healthy
      nextjs:
        condition: service_healthy
      django_admin:
        condition: service_healthy

    networks:
      - proxy

    healthcheck:
      test: [ "CMD-SHELL", "nginx -t && curl -sf http://localhost/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ---------------------------------------------------------------------------
  # Certbot — Let's Encrypt SSL certificate renewal
  # Runs once on startup to check/renew certs, then exits.
  # A cron job on the host runs `docker compose run certbot` every 12 hours.
  # (Or use the entrypoint loop version below if you prefer it self-contained.)
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: tradie_certbot
    restart: "no" # Does not stay running — runs and exits.

    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    # Attempt renewal. Certbot is smart — if the cert has more than 30 days
    # left, it does nothing. If less than 30 days, it renews.
    # On first run (no cert exists), you need to run the initial issuance
    # command manually — see README.md for the exact command.
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "

    networks:
      - proxy
