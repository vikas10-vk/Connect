# =============================================================================
# .github/workflows/test.yml — CI: Lint, typecheck, and test
# Tradie Platform
# =============================================================================
#
# TRIGGERS:
#   - Every push to any branch
#   - Every pull request to main
#
# WHAT THIS DOES:
#   1. Ruff lint    — catches style errors and common bugs
#   2. Mypy         — catches type errors before runtime
#   3. Pytest       — runs all tests against REAL PostgreSQL and Redis
#                     (not SQLite, not mocks — same as production)
#
# WHY REAL SERVICES:
#   SQLite does not support: UUIDs, JSONB, asyncpg, citext, array types,
#   partial indexes, or most PostgreSQL-specific constraints.
#   Tests that pass on SQLite fail in production. We always test against
#   the same database engine we run in production.
#
# REQUIRED GITHUB SECRETS: None (all credentials are test-only defaults)
# =============================================================================

name: Test

on:
  push:
    branches: ["**"]   # Run on every branch push
  pull_request:
    branches: [main]   # Run on all PRs targeting main

# Cancel in-progress runs for the same branch when a new push arrives.
# Prevents queuing up 5 test runs after rapid commits.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Fail fast if something hangs

    # ── Service containers ────────────────────────────────────────────────────
    # These start before the job steps and are available via localhost.
    # Using the same versions as production docker-compose.prod.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tradie_test
          POSTGRES_USER:     tradie
          POSTGRES_PASSWORD: test_password_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradie -d tradie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # ── 4. Ruff lint ──────────────────────────────────────────────────────────
      # Catches: unused imports, undefined names, style issues, common bugs.
      # Configured via pyproject.toml [tool.ruff].
      - name: Lint with ruff
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      # ── 5. Mypy type check ────────────────────────────────────────────────────
      # Catches type errors that tests might not hit.
      # --ignore-missing-imports: third-party stubs are not always available.
      - name: Type check with mypy
        working-directory: backend
        run: |
          mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # Type errors are warnings until stubs are complete
        # Remove continue-on-error once all type annotations are complete.

      # ── 6. Run database migrations ────────────────────────────────────────────
      # Apply all migrations to the test database before running tests.
      # This verifies migrations are valid AND the test DB has the correct schema.
      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          SECRET_KEY:   ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:    HS256
        run: |
          alembic upgrade head

      # ── 7. Run tests ──────────────────────────────────────────────────────────
      - name: Run tests with pytest
        working-directory: backend
        env:
          # Test database — separate from dev, never touches real data
          DATABASE_URL:     postgresql+asyncpg://tradie:test_password_ci@localhost:5432/tradie_test
          REDIS_URL:        redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          ENVIRONMENT:      test
          DEBUG:            "true"

          # Test-only secrets — these are NOT real secrets, CI-only values
          SECRET_KEY:             ci-test-secret-key-minimum-32-chars-xxxxxxxxxxx
          ALGORITHM:              HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REFRESH_TOKEN_EXPIRE_DAYS:   "7"
          FIELD_ENCRYPTION_KEY:   ""

          # Disable external services in tests
          SENTRY_BACKEND_DSN:   ""
          STRIPE_SECRET_KEY:    sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY:       ""
          TWILIO_ACCOUNT_SID:   ""
          TWILIO_AUTH_TOKEN:    ""

          # R2/S3 — use placeholders, tests should mock these
          R2_ACCOUNT_ID:        test
          R2_ACCESS_KEY_ID:     test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET_NAME:       test-bucket
          R2_PUBLIC_URL:        http://localhost

        run: |
          pytest tests/ \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v
        # --cov-fail-under=60: fail if test coverage drops below 60%.
        # Raise this threshold as you add more tests. Target is 80% by launch.

      # ── 8. Upload coverage report ─────────────────────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()   # Upload even if tests fail — useful for debugging
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ── Frontend build check ────────────────────────────────────────────────────
  # Ensures the Next.js frontend at least builds without errors.
  # Does not run tests yet — add playwright tests in Phase 2.
  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Next.js
        working-directory: frontend
        env:
          # Provide required env vars so the build doesn't fail on missing vars
          NEXT_PUBLIC_API_URL:    http://localhost:8000
          NEXT_PUBLIC_WS_URL:     ws://localhost:8000
          NEXT_PUBLIC_STRIPE_KEY: pk_test_placeholder
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build